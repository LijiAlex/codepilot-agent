# codepilot.example.yml — copy to codepilot.yml (gitignored) and edit
# Repositories CodePilot+ watches. `scripts/with-env codepilot connect OWNER/REPO --write` adds an entry
# here for you. You can also write one by hand, like the example below (remove the leading # to use it).
repos:
#  - owner: your-github-login                       # the repository's owner
#    name: your-repo                                # the repository's name
#    install_command: "pip install -e . pytest"     # installs the project and pytest in the sandbox
#    test_command: "python -m pytest -q"            # runs its tests
#    protected_paths: ["tests/test_contract_*.py"]  # extra files the agents must never change (added to the defaults)
#    author_allowlist: [your-github-login]          # only issues opened by these people are picked up
poll_interval_s: 300
max_model_calls_per_run: 60      # per agent invocation; keeps one run's spend bounded
max_tool_calls_per_run: 200
complexity_threshold: 6
solver_model: "anthropic:claude-sonnet-5-5"
sandbox: daytona
daytona_snapshot: null          # Daytona default image
daytona_auto_stop_minutes: 30
github_app_id_env: CODEPILOT_GH_APP_ID
github_app_key_path_env: CODEPILOT_GH_APP_KEY_PATH
injection_checker: nemo          # issue screen: NeMo Guardrails input rails (brief)
guardrail_model: "anthropic:claude-haiku-5-5"
reviewer_login: "codepilot-reviewer[bot]"   # your reviewer App slug + [bot]; the dashboard shows its reviews and gates Merge on them
