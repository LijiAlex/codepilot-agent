<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 360" width="1600" height="360" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4A5561"/></marker>
<style>
.h1{font-size:26px;font-weight:700;fill:#18212B} .sub{font-size:14px;fill:#5B6773}
.t{font-size:14.5px;font-weight:650;fill:#18212B} .s{font-size:12.5px;fill:#3B4651}
.f{font-size:13.5px;font-weight:650;fill:#5B6773} .tag{font-size:10px;font-weight:700;fill:#fff;letter-spacing:.04em}
.al{font-size:12px;fill:#4A5561;font-style:italic} .lg{font-size:13px;fill:#3B4651}
</style></defs>
<rect width="1600" height="360" fill="#F7F9FA"/>
<text x="30" y="44" class="h1">PR review</text>
<rect x="172.5" y="27" width="38.8" height="20" rx="10" fill="#B4366B"/>
<text x="191.9" y="41" class="tag" text-anchor="middle">PLUS</text>
<text x="30" y="68" class="sub">Every CodePilot+ pull request is scored by a model from a different company; code decides merge-ready</text>
<rect x="1040" y="30" width="18" height="18" rx="4" fill="#EAF1FD" stroke="#2F6FDB" stroke-width="1.6"/>
<text x="1066" y="44" class="lg">AI agent / model</text>
<rect x="1225" y="30" width="18" height="18" rx="4" fill="#E4F3F2" stroke="#0E7C7B" stroke-width="1.6"/>
<text x="1251" y="44" class="lg">plain code</text>
<rect x="1410" y="30" width="18" height="18" rx="4" fill="#FCEEDD" stroke="#C46A00" stroke-width="1.6"/>
<text x="1436" y="44" class="lg">a human decides</text>
<rect x="1040" y="56" width="46.0" height="17" rx="8.5" fill="#46546A"/>
<text x="1063.0" y="68.5" class="tag" text-anchor="middle">BRIEF</text>
<text x="1094.0" y="69" class="lg">assignment brief</text>
<rect x="1225" y="56" width="46.0" height="17" rx="8.5" fill="#6B4FBB"/>
<text x="1248.0" y="68.5" class="tag" text-anchor="middle">BONUS</text>
<text x="1279.0" y="69" class="lg">brief optional extra</text>
<rect x="1410" y="56" width="38.8" height="17" rx="8.5" fill="#B4366B"/>
<text x="1429.4" y="68.5" class="tag" text-anchor="middle">PLUS</text>
<text x="1456.8" y="69" class="lg">beyond the brief</text>
<rect x="30" y="150" width="230" height="90" rx="9" fill="#FFFFFF" stroke="#5B6773" stroke-width="1.6"/>
<text x="42" y="172" class="t">Pull request</text>
<text x="42" y="191" class="s">opened or updated by</text>
<text x="42" y="208" class="s">CodePilot+, a human or a fork</text>
<rect x="300" y="100" width="520" height="230" rx="14" fill="none" stroke="#8A96A3" stroke-width="1.4" stroke-dasharray="6 5"/>
<text x="314" y="122" class="f">Independent reviewer · GitHub Action</text>
<rect x="320" y="140" width="220" height="74" rx="9" fill="#E4F3F2" stroke="#0E7C7B" stroke-width="1.6"/>
<text x="332" y="162" class="t">Job 1: tests</text>
<rect x="491.2" y="131" width="38.8" height="18" rx="9" fill="#0E7C7B"/>
<text x="510.59999999999997" y="144" class="tag" text-anchor="middle">CODE</text>
<text x="332" y="181" class="s">runs the PR's tests, no secrets;</text>
<text x="332" y="198" class="s">not run for forks</text>
<rect x="320" y="236" width="220" height="74" rx="9" fill="#EAF1FD" stroke="#2F6FDB" stroke-width="1.6"/>
<text x="332" y="258" class="t">Job 2: review</text>
<rect x="505.6" y="227" width="24.4" height="18" rx="9" fill="#2F6FDB"/>
<text x="517.8000000000001" y="240" class="tag" text-anchor="middle">AI</text>
<text x="332" y="277" class="s">OpenAI model scores</text>
<text x="332" y="294" class="s">5 criteria × 0–2</text>
<rect x="580" y="180" width="220" height="90" rx="9" fill="#E4F3F2" stroke="#0E7C7B" stroke-width="1.6"/>
<text x="592" y="202" class="t">Score caps</text>
<rect x="751.2" y="171" width="38.8" height="18" rx="9" fill="#0E7C7B"/>
<text x="770.6" y="184" class="tag" text-anchor="middle">CODE</text>
<text x="592" y="221" class="s">security concerns → max 4</text>
<text x="592" y="238" class="s">tests not run or failing</text>
<text x="592" y="255" class="s">→ max 6</text>
<path d="M 260,195 L 280,195 L 280,177 L 318,177" fill="none" stroke="#4A5561" stroke-width="1.7" marker-end="url(#ah)" />
<path d="M 280,195 L 280,273 L 318,273" fill="none" stroke="#4A5561" stroke-width="1.7" marker-end="url(#ah)" />
<path d="M 540,177 L 560,177 L 560,215 L 578,215" fill="none" stroke="#4A5561" stroke-width="1.7" marker-end="url(#ah)" />
<path d="M 540,273 L 560,273 L 560,235 L 578,235" fill="none" stroke="#4A5561" stroke-width="1.7" marker-end="url(#ah)" />
<rect x="860" y="170" width="230" height="110" rx="9" fill="#E4F3F2" stroke="#0E7C7B" stroke-width="1.6"/>
<text x="872" y="192" class="t">Merge-ready?</text>
<rect x="1041.2" y="161" width="38.8" height="18" rx="9" fill="#0E7C7B"/>
<text x="1060.6000000000001" y="174" class="tag" text-anchor="middle">CODE</text>
<text x="872" y="211" class="s">score ≥ 8, tests pass,</text>
<text x="872" y="228" class="s">no security concerns,</text>
<text x="872" y="245" class="s">≤ 200 lines changed,</text>
<text x="872" y="262" class="s">no protected files</text>
<path d="M 800,225 L 858,225" fill="none" stroke="#4A5561" stroke-width="1.7" marker-end="url(#ah)" />
<rect x="1140" y="110" width="200" height="74" rx="9" fill="#FCEEDD" stroke="#C46A00" stroke-width="1.6"/>
<text x="1152" y="132" class="t">You merge</text>
<rect x="1284.0" y="101" width="46.0" height="18" rx="9" fill="#C46A00"/>
<text x="1307.0" y="114" class="tag" text-anchor="middle">HUMAN</text>
<text x="1152" y="151" class="s">from the dashboard</text>
<rect x="1370" y="110" width="200" height="74" rx="9" fill="#E4F3F2" stroke="#0E7C7B" stroke-width="1.6"/>
<text x="1382" y="132" class="t">PR watcher</text>
<rect x="1521.2" y="101" width="38.8" height="18" rx="9" fill="#0E7C7B"/>
<text x="1540.6000000000001" y="114" class="tag" text-anchor="middle">CODE</text>
<text x="1382" y="151" class="s">merged → lesson saved</text>
<text x="1382" y="168" class="s">conflict → run stops</text>
<rect x="1140" y="260" width="200" height="74" rx="9" fill="#FCEEDD" stroke="#C46A00" stroke-width="1.6"/>
<text x="1152" y="282" class="t">A human decides</text>
<rect x="1284.0" y="251" width="46.0" height="18" rx="9" fill="#C46A00"/>
<text x="1307.0" y="264" class="tag" text-anchor="middle">HUMAN</text>
<text x="1152" y="301" class="s">labelled needs-review</text>
<path d="M 1090,205 L 1115,205 L 1115,147 L 1138,147" fill="none" stroke="#4A5561" stroke-width="1.7" marker-end="url(#ah)" />
<text x="1104" y="170" class="al" text-anchor="middle">yes</text>
<path d="M 1090,245 L 1115,245 L 1115,297 L 1138,297" fill="none" stroke="#4A5561" stroke-width="1.7" marker-end="url(#ah)" />
<text x="1104" y="280" class="al" text-anchor="middle">no</text>
<path d="M 1340,147 L 1368,147" fill="none" stroke="#4A5561" stroke-width="1.7" marker-end="url(#ah)" />
</svg>