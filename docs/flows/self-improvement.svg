<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 380" width="1600" height="380" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4A5561"/></marker>
<style>
.h1{font-size:26px;font-weight:700;fill:#18212B} .sub{font-size:14px;fill:#5B6773}
.t{font-size:14.5px;font-weight:650;fill:#18212B} .s{font-size:12.5px;fill:#3B4651}
.f{font-size:13.5px;font-weight:650;fill:#5B6773} .tag{font-size:10px;font-weight:700;fill:#fff;letter-spacing:.04em}
.al{font-size:12px;fill:#4A5561;font-style:italic} .lg{font-size:13px;fill:#3B4651}
</style></defs>
<rect width="1600" height="380" fill="#F7F9FA"/>
<text x="30" y="44" class="h1">Self-improvement loop</text>
<rect x="346.5" y="27" width="38.8" height="20" rx="10" fill="#B4366B"/>
<text x="365.9" y="41" class="tag" text-anchor="middle">PLUS</text>
<text x="30" y="68" class="sub">After every run, CodePilot+ proposes one change to the repository's skill; nothing changes until you approve</text>
<rect x="1040" y="30" width="18" height="18" rx="4" fill="#EAF1FD" stroke="#2F6FDB" stroke-width="1.6"/>
<text x="1066" y="44" class="lg">AI agent / model</text>
<rect x="1225" y="30" width="18" height="18" rx="4" fill="#E4F3F2" stroke="#0E7C7B" stroke-width="1.6"/>
<text x="1251" y="44" class="lg">plain code</text>
<rect x="1410" y="30" width="18" height="18" rx="4" fill="#FCEEDD" stroke="#C46A00" stroke-width="1.6"/>
<text x="1436" y="44" class="lg">a human decides</text>
<rect x="1040" y="56" width="46.0" height="17" rx="8.5" fill="#46546A"/>
<text x="1063.0" y="68.5" class="tag" text-anchor="middle">BRIEF</text>
<text x="1094.0" y="69" class="lg">assignment brief</text>
<rect x="1225" y="56" width="46.0" height="17" rx="8.5" fill="#6B4FBB"/>
<text x="1248.0" y="68.5" class="tag" text-anchor="middle">BONUS</text>
<text x="1279.0" y="69" class="lg">brief optional extra</text>
<rect x="1410" y="56" width="38.8" height="17" rx="8.5" fill="#B4366B"/>
<text x="1429.4" y="68.5" class="tag" text-anchor="middle">PLUS</text>
<text x="1456.8" y="69" class="lg">beyond the brief</text>
<rect x="30" y="130" width="190" height="78" rx="9" fill="#E4F3F2" stroke="#0E7C7B" stroke-width="1.6"/>
<text x="42" y="152" class="t">Run ends</text>
<rect x="171.2" y="121" width="38.8" height="18" rx="9" fill="#0E7C7B"/>
<text x="190.6" y="134" class="tag" text-anchor="middle">CODE</text>
<text x="42" y="171" class="s">any outcome</text>
<rect x="250" y="130" width="190" height="78" rx="9" fill="#E4F3F2" stroke="#0E7C7B" stroke-width="1.6"/>
<text x="262" y="152" class="t">Trace analysis</text>
<rect x="391.2" y="121" width="38.8" height="18" rx="9" fill="#0E7C7B"/>
<text x="410.59999999999997" y="134" class="tag" text-anchor="middle">CODE</text>
<text x="262" y="171" class="s">refused commands,</text>
<text x="262" y="188" class="s">files hard to find</text>
<rect x="470" y="130" width="190" height="78" rx="9" fill="#EAF1FD" stroke="#2F6FDB" stroke-width="1.6"/>
<text x="482" y="152" class="t">Skill gap report</text>
<rect x="625.6" y="121" width="24.4" height="18" rx="9" fill="#2F6FDB"/>
<text x="637.8000000000001" y="134" class="tag" text-anchor="middle">AI</text>
<text x="482" y="171" class="s">what slowed the</text>
<text x="482" y="188" class="s">agents down</text>
<rect x="690" y="130" width="190" height="78" rx="9" fill="#EAF1FD" stroke="#2F6FDB" stroke-width="1.6"/>
<text x="702" y="152" class="t">One proposal</text>
<rect x="845.6" y="121" width="24.4" height="18" rx="9" fill="#2F6FDB"/>
<text x="857.8000000000001" y="134" class="tag" text-anchor="middle">AI</text>
<text x="702" y="171" class="s">add, correct or</text>
<text x="702" y="188" class="s">retire one step</text>
<rect x="910" y="130" width="190" height="78" rx="9" fill="#E4F3F2" stroke="#0E7C7B" stroke-width="1.6"/>
<text x="922" y="152" class="t">Confidence</text>
<rect x="1051.2" y="121" width="38.8" height="18" rx="9" fill="#0E7C7B"/>
<text x="1070.6000000000001" y="134" class="tag" text-anchor="middle">CODE</text>
<text x="922" y="171" class="s">rises when later runs</text>
<text x="922" y="188" class="s">propose it again</text>
<rect x="1130" y="130" width="190" height="78" rx="9" fill="#FCEEDD" stroke="#C46A00" stroke-width="1.6"/>
<text x="1142" y="152" class="t">You decide</text>
<rect x="1264.0" y="121" width="46.0" height="18" rx="9" fill="#C46A00"/>
<text x="1287.0" y="134" class="tag" text-anchor="middle">HUMAN</text>
<text x="1142" y="171" class="s">on the dashboard</text>
<rect x="1350" y="130" width="190" height="78" rx="9" fill="#E4F3F2" stroke="#0E7C7B" stroke-width="1.6"/>
<text x="1362" y="152" class="t">Repo skill v+1</text>
<rect x="1491.2" y="121" width="38.8" height="18" rx="9" fill="#0E7C7B"/>
<text x="1510.6000000000001" y="134" class="tag" text-anchor="middle">CODE</text>
<text x="1362" y="171" class="s">old versions kept</text>
<path d="M 220,169 L 248,169" fill="none" stroke="#4A5561" stroke-width="1.7" marker-end="url(#ah)" />
<path d="M 440,169 L 468,169" fill="none" stroke="#4A5561" stroke-width="1.7" marker-end="url(#ah)" />
<path d="M 660,169 L 688,169" fill="none" stroke="#4A5561" stroke-width="1.7" marker-end="url(#ah)" />
<path d="M 880,169 L 908,169" fill="none" stroke="#4A5561" stroke-width="1.7" marker-end="url(#ah)" />
<path d="M 1100,169 L 1128,169" fill="none" stroke="#4A5561" stroke-width="1.7" marker-end="url(#ah)" />
<path d="M 1320,169 L 1348,169" fill="none" stroke="#4A5561" stroke-width="1.7" marker-end="url(#ah)" />
<rect x="1130" y="260" width="190" height="56" rx="9" fill="#E4F3F2" stroke="#0E7C7B" stroke-width="1.6"/>
<text x="1142" y="282" class="t">Not applied</text>
<rect x="1271.2" y="251" width="38.8" height="18" rx="9" fill="#0E7C7B"/>
<text x="1290.6000000000001" y="264" class="tag" text-anchor="middle">CODE</text>
<text x="1142" y="301" class="s">the rejection is recorded</text>
<path d="M 1225,208 L 1225,258" fill="none" stroke="#4A5561" stroke-width="1.7" marker-end="url(#ah)" />
<text x="1255" y="238" class="al" text-anchor="middle">reject</text>
<path d="M 1445,208 L 1445,345 L 125,345 L 125,210" fill="none" stroke="#4A5561" stroke-width="1.7" marker-end="url(#ah)" />
<text x="785" y="338" class="al" text-anchor="middle">the next run on this repository uses the new skill</text>
</svg>