<path d="M 776,159 L 796,159" fill="none" stroke="#4A5561" stroke-width="1.7" marker-end="url(#ah)" />
<rect x="990" y="120" width="170" height="78" rx="9" fill="#E4F3F2" stroke="#0E7C7B" stroke-width="1.6"/>
<text x="1002" y="142" class="t">Repo skill v1</text>
<rect x="1111.2" y="111" width="38.8" height="18" rx="9" fill="#0E7C7B"/>
<text x="1130.6000000000001" y="124" class="tag" text-anchor="middle">CODE</text>
<text x="1002" y="161" class="s">notes for this</text>
<text x="1002" y="178" class="s">repository</text>
<path d="M 968,159 L 988,159" fill="none" stroke="#4A5561" stroke-width="1.7" marker-end="url(#ah)" />
<rect x="1182" y="120" width="170" height="78" rx="9" fill="#E4F3F2" stroke="#0E7C7B" stroke-width="1.6"/>
<text x="1194" y="142" class="t">Code index</text>
<rect x="1303.2" y="111" width="38.8" height="18" rx="9" fill="#0E7C7B"/>
<text x="1322.6000000000001" y="124" class="tag" text-anchor="middle">CODE</text>
<text x="1194" y="161" class="s">embeddings for</text>
<text x="1194" y="178" class="s">search</text>
<path d="M 1160,159 L 1180,159" fill="none" stroke="#4A5561" stroke-width="1.7" marker-end="url(#ah)" />
<rect x="1374" y="120" width="170" height="78" rx="9" fill="#E4F3F2" stroke="#0E7C7B" stroke-width="1.6"/>
<text x="1386" y="142" class="t">codepilot.yml</text>
<rect x="1495.2" y="111" width="38.8" height="18" rx="9" fill="#0E7C7B"/>
<text x="1514.6000000000001" y="124" class="tag" text-anchor="middle">CODE</text>
<text x="1386" y="161" class="s">the repository's</text>
<text x="1386" y="178" class="s">entry is added</text>
<path d="M 1352,159 L 1372,159" fill="none" stroke="#4A5561" stroke-width="1.7" marker-end="url(#ah)" />
