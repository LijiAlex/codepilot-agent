<rect x="280" y="262" width="230" height="140" rx="9" fill="#E4F3F2" stroke="#0E7C7B" stroke-width="1.6"/>
<text x="292" y="284" class="t">Context for the agents</text>
<rect x="461.2" y="253" width="38.8" height="18" rx="9" fill="#0E7C7B"/>
<text x="480.59999999999997" y="266" class="tag" text-anchor="middle">CODE</text>
<text x="292" y="303" class="s">repo map: tree + summaries,</text>
<text x="292" y="320" class="s">ranked by PageRank, ≤ 4,000</text>
<text x="292" y="337" class="s">tokens · task skill + repo skill</text>
<text x="292" y="354" class="s">top-3 similar lessons</text>
<text x="292" y="371" class="s">files read only on demand</text>
