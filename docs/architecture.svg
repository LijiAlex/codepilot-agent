<rect width="1600" height="1010" fill="#F7F9FA"/>
<text x="30" y="44" class="h1">CodePilot+ — architecture</text>
<text x="30" y="68" class="sub">GitHub issue → screened → agents in a sandbox → human approval → pull request → independent review → merge → lessons</text>
<rect x="1040" y="30" width="18" height="18" rx="4" fill="#EAF1FD" stroke="#2F6FDB" stroke-width="1.6"/>
<text x="1066" y="44" class="lg">AI agent / model</text>
<rect x="1225" y="30" width="18" height="18" rx="4" fill="#E4F3F2" stroke="#0E7C7B" stroke-width="1.6"/>
<text x="1251" y="44" class="lg">plain code</text>
<rect x="1410" y="30" width="18" height="18" rx="4" fill="#FCEEDD" stroke="#C46A00" stroke-width="1.6"/>
<text x="1436" y="44" class="lg">a human decides</text>
<rect x="1040" y="56" width="44" height="17" rx="8.5" fill="#B4366B"/><text x="1062" y="68.5" class="tag" text-anchor="middle">PLUS</text>
<text x="1092" y="69" class="lg">beyond the assignment brief</text>
