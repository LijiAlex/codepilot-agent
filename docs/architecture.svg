<text x="572" y="622" class="t">Publish (after approval)</text>
<rect x="801.2" y="591" width="38.8" height="18" rx="9" fill="#0E7C7B"/>
<text x="820.6" y="604" class="tag" text-anchor="middle">CODE</text>
<text x="572" y="641" class="s">re-checks the issue and main</text>
<text x="572" y="658" class="s">one commit + PR with labels,</text>
<text x="572" y="675" class="s">via the GitHub App — the only</text>
<text x="572" y="692" class="s">path to GitHub</text>
