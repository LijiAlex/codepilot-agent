<text x="1527.8" y="266" class="tag" text-anchor="middle">AI</text>
<text x="1387" y="303" class="s">OpenAI model — a</text>
<text x="1387" y="320" class="s">different company</text>
<rect x="1190" y="352" width="360" height="104" rx="9" fill="#E4F3F2" stroke="#0E7C7B" stroke-width="1.6"/>
<text x="1202" y="374" class="t">Score and merge-ready</text>
<rect x="1501.2" y="343" width="38.8" height="18" rx="9" fill="#0E7C7B"/>
<text x="1520.6000000000001" y="356" class="tag" text-anchor="middle">CODE</text>
<text x="1202" y="393" class="s">5 criteria × 0–2 = score /10 · effort 1–5 from the diff</text>
<text x="1202" y="410" class="s">caps: security → 4, tests not run/failing → 6</text>
<text x="1202" y="427" class="s">merge-ready: score ≥ 8, tests green, no security</text>
<text x="1202" y="444" class="s">concerns, ≤ 200 lines, no protected files</text>
