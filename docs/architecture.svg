<text x="1100.6000000000001" y="604" class="tag" text-anchor="middle">CODE</text>
<text x="892" y="641" class="s">merged → run done, lesson saved</text>
<text x="892" y="658" class="s">closed → run closed</text>
<text x="892" y="675" class="s">conflict → stops, never resolves</text>
<rect x="1170" y="110" width="400" height="72" rx="9" fill="#FFFFFF" stroke="#5B6773" stroke-width="1.6"/>
