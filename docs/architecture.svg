<text x="937.8000000000001" y="266" class="tag" text-anchor="middle">AI</text>
<text x="572" y="303" class="s">plans with write_todos · delegates by file path, never contents</text>
<path d="M 510,300 L 558,300" fill="none" stroke="#4A5561" stroke-width="1.7" marker-end="url(#ah)" />
<rect x="560" y="368" width="125" height="72" rx="9" fill="#EAF1FD" stroke="#2F6FDB" stroke-width="1.6"/>
<text x="572" y="390" class="t">Repo Explorer</text>
<text x="572" y="409" class="s">keyword or</text>
<text x="572" y="426" class="s">embedding search</text>
<rect x="700" y="368" width="120" height="72" rx="9" fill="#EAF1FD" stroke="#2F6FDB" stroke-width="1.6"/>
<text x="712" y="390" class="t">Coder</text>
<text x="712" y="409" class="s">small edits,</text>
<text x="712" y="426" class="s">runs the code</text>
<rect x="835" y="368" width="125" height="72" rx="9" fill="#EAF1FD" stroke="#2F6FDB" stroke-width="1.6"/>
<text x="847" y="390" class="t">PR Agent</text>
<text x="847" y="409" class="s">drafts commit</text>
<text x="847" y="426" class="s">and PR text</text>
<path d="M 622,328 L 622,366" fill="none" stroke="#4A5561" stroke-width="1.7" marker-end="url(#ah)" />
<path d="M 760,328 L 760,366" fill="none" stroke="#4A5561" stroke-width="1.7" marker-end="url(#ah)" />
