<rect x="680" y="472" width="160" height="84" rx="9" fill="#EAF1FD" stroke="#2F6FDB" stroke-width="1.6"/>
<text x="692" y="494" class="t">Test Agent</text>
<text x="692" y="513" class="s">writes + runs tests,</text>
<text x="692" y="530" class="s">max 3 attempts;</text>
<text x="692" y="547" class="s">Test Doctor fixes setup</text>
<path d="M 760,440 L 760,470" fill="none" stroke="#4A5561" stroke-width="1.7" marker-end="url(#ah)" />
<rect x="870" y="452" width="245" height="98" rx="9" fill="#E4F3F2" stroke="#0E7C7B" stroke-width="1.6"/>
<text x="882" y="474" class="t">Guards on every tool call</text>
<rect x="1066.2" y="443" width="38.8" height="18" rx="9" fill="#0E7C7B"/>
<text x="1085.6000000000001" y="456" class="tag" text-anchor="middle">CODE</text>
<text x="882" y="493" class="s">commands: allow / refuse / ask</text>
<text x="882" y="510" class="s">write only inside the sandbox</text>
<text x="882" y="527" class="s">no secret files</text>
<text x="882" y="544" class="s">file check before publishing</text>
<rect x="280" y="422" width="230" height="128" rx="9" fill="#E4F3F2" stroke="#0E7C7B" stroke-width="1.6"/>
<text x="292" y="444" class="t">Save and end the run</text>
<rect x="461.2" y="413" width="38.8" height="18" rx="9" fill="#0E7C7B"/>
<text x="480.59999999999997" y="426" class="tag" text-anchor="middle">CODE</text>
<text x="292" y="463" class="s">the run saves its work and</text>
<text x="292" y="480" class="s">frees the sandbox; nothing</text>
<text x="292" y="497" class="s">waits on a human</text>
<text x="292" y="514" class="s">(then: approval queue)</text>
<rect x="260" y="600" width="270" height="100" rx="9" fill="#E4F3F2" stroke="#0E7C7B" stroke-width="1.6"/>
<text x="272" y="622" class="t">Approval queue</text>
