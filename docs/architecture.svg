<text x="42" y="622" class="t">You · terminal UI</text>
<rect x="174.0" y="591" width="46.0" height="18" rx="9" fill="#C46A00"/>
<text x="197.0" y="604" class="tag" text-anchor="middle">HUMAN</text>
<text x="42" y="641" class="s">4 panels: issues, active task,</text>
<text x="42" y="658" class="s">live agent logs, approvals</text>
<text x="42" y="675" class="s">a approve · r reject · v inspect</text>
<rect x="30" y="760" width="200" height="106" rx="9" fill="#FCEEDD" stroke="#C46A00" stroke-width="1.6"/>
<text x="42" y="782" class="t">You · dashboard</text>
<rect x="174.0" y="751" width="46.0" height="18" rx="9" fill="#C46A00"/>
<text x="197.0" y="764" class="tag" text-anchor="middle">HUMAN</text>
<rect x="122.0" y="751" width="46" height="18" rx="9" fill="#B4366B"/>
<text x="145.0" y="764" class="tag" text-anchor="middle">PLUS</text>
<text x="42" y="801" class="s">merge pull requests,</text>
<text x="42" y="818" class="s">approve skill changes,</text>
<text x="42" y="835" class="s">evaluation, safety, costs,</text>
<text x="42" y="852" class="s">audit log</text>
<rect x="260" y="110" width="195" height="72" rx="9" fill="#E4F3F2" stroke="#0E7C7B" stroke-width="1.6"/>
<text x="272" y="132" class="t">Poller</text>
<rect x="406.2" y="101" width="38.8" height="18" rx="9" fill="#0E7C7B"/>
<text x="425.59999999999997" y="114" class="tag" text-anchor="middle">CODE</text>
<text x="272" y="151" class="s">every 5 min, GitHub Toolkit</text>
<text x="272" y="168" class="s">skips claimed / recently failed</text>
<rect x="475" y="110" width="225" height="72" rx="9" fill="#EAF1FD" stroke="#2F6FDB" stroke-width="1.6"/>
<text x="487" y="132" class="t">Clean + injection screen</text>
<rect x="665.6" y="101" width="24.4" height="18" rx="9" fill="#2F6FDB"/>
<text x="677.8000000000001" y="114" class="tag" text-anchor="middle">AI</text>
<text x="487" y="151" class="s">NeMo: regex rail + Claude Haiku</text>
<text x="487" y="168" class="s">self-check; blocked issues stop</text>
<rect x="720" y="110" width="200" height="72" rx="9" fill="#EAF1FD" stroke="#2F6FDB" stroke-width="1.6"/>
<text x="732" y="132" class="t">Triage</text>
<rect x="885.6" y="101" width="24.4" height="18" rx="9" fill="#2F6FDB"/>
<text x="897.8000000000001" y="114" class="tag" text-anchor="middle">AI</text>
<text x="732" y="151" class="s">5 task types → which skill</text>
<text x="732" y="168" class="s">complexity score 1–10</text>
<rect x="940" y="110" width="190" height="72" rx="9" fill="#EAF1FD" stroke="#2F6FDB" stroke-width="1.6"/>
<text x="952" y="132" class="t">Too complex?</text>
<rect x="1095.6" y="101" width="24.4" height="18" rx="9" fill="#2F6FDB"/>
<text x="1107.8" y="114" class="tag" text-anchor="middle">AI</text>
<rect x="1043.6" y="101" width="46" height="18" rx="9" fill="#B4366B"/>
<text x="1066.6" y="114" class="tag" text-anchor="middle">PLUS</text>
<text x="952" y="151" class="s">a plan goes to approval</text>
<text x="952" y="168" class="s">instead of code</text>
