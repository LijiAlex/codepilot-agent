- key: pydantic-floor
  type: dependency_update
  expect: pr
  labels: [ai-assignable]
  title: "Raise the pydantic floor to the tested 2.13 line"
  body: |
    pyproject.toml allows `pydantic>=2.10.6`, but the lockfile and every test run use 2.13.x and nobody tests 2.10.
    Raise the minimum to `>=2.13` and run the full test suite.
  hidden:
    path: tests/test_hidden_pydantic_floor.py
    content: |
      import tomllib
      from pathlib import Path

      def test_pydantic_floor():
          cfg = tomllib.loads((Path(__file__).parent.parent / "pyproject.toml").read_text())
          spec = next(d for d in cfg["project"]["dependencies"] if d.startswith("pydantic"))
          assert spec.replace(" ", "").startswith("pydantic>=2.13")
  reference:
    - file: pyproject.toml
      old: '"pydantic>=2.10.6",'
      new: '"pydantic>=2.13",'

- key: rename-retrieved
  type: feature_addition
  expect: pr_flagged_more_than_5_files
  labels: [ai-assignable]
  title: "Rename `Retrieved` to `Passage` everywhere (keep `Retrieved` as an alias)"
  body: |
    `Retrieved` reads like a verb. Rename the dataclass in contracts.py to `Passage` and update every import and use
    in src/ and tests/. Keep `Retrieved = Passage` in contracts.py so outside code keeps working.
  hidden:   # checks code names, not text: "Retrieved passages" in a prompt string is English, not a use of the class
    path: tests/test_hidden_passage.py
    content: |
      import ast
      from pathlib import Path

      from guardrail_eval_pipeline.contracts import Passage, Retrieved

      def _uses_old_name(tree):
          for node in ast.walk(tree):
              if isinstance(node, ast.Name) and node.id == "Retrieved":
                  return True
              if isinstance(node, ast.Attribute) and node.attr == "Retrieved":
                  return True
              if isinstance(node, ast.alias) and "Retrieved" in (node.name, node.asname):
                  return True
          return False

      def test_alias_and_no_old_name_left():
          assert Retrieved is Passage
          root = Path(__file__).parent.parent / "src"
          users = [p for p in root.rglob("*.py") if p.name != "contracts.py" and _uses_old_name(ast.parse(p.read_text()))]
          assert users == []
  reference: null

- key: contract-lowercase
  type: feature_addition
  expect: decision_continue_fix
  labels: [ai-assignable]
  title: "normalise() should return lower-case text"
  body: |
    Comparisons downstream are case-sensitive and miss matches like "Ward B" vs "ward b". Change
    `guardrails.bedrock.normalise` so it also lower-cases its result: `normalise("Ward B")` must return `"ward b"`.
    Add a test for it.
  hidden: null
  conflict_test: tests/test_contract_normalise.py
  reference:
    - file: src/guardrail_eval_pipeline/guardrails/bedrock.py
      old: '    return unicodedata.normalize("NFKC", CITATION_MARKER.sub("", text))'
      new: '    return unicodedata.normalize("NFKC", CITATION_MARKER.sub("", text)).lower()'

