      import re
      from pathlib import Path

      def test_readme_has_library_section():
          text = (Path(__file__).parent.parent / "README.md").read_text()
          m = re.search(r"^#{2,3} Using it as a library\n(.*?)(?=^#{1,3} |\Z)", text, re.S | re.M)   # the issue names no heading level
