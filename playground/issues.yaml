# playground/issues.yaml — issues filed on LijiAlex/codepilot-playground (a copy of guardrail-eval-pipeline v0.2.0).
# expect: what CodePilot+ should do. hidden: a fail→pass test kept OUT of the playground (run by
# scripts/evaluate_playground.py, never shown to the agents). reference: a known-good fix, used only by
# playground/verify.py to prove each hidden test fails before and passes after.
- key: citation-off-by-one
  type: bug_fix
  expect: pr
  labels: [ai-assignable]
  title: "Citation 【3】 reported out of range when the answer used three passages"
  body: |
    The output guardrail records `citation-out-of-range:3` for an answer that cites 【3】 and was built from
    exactly three retrieved passages. Passages are numbered from 1, so 【3】 is the last one and is valid.
    `citation-out-of-range` should only appear for numbers below 1 or above the number of passages.
  hidden:
    path: tests/test_hidden_citation.py
    content: |
      from guardrail_eval_pipeline.contracts import Retrieved
      from guardrail_eval_pipeline.guardrails.deterministic import bad_citations

      def test_last_passage_is_in_range():
          ctx = [Retrieved(text="a"), Retrieved(text="b"), Retrieved(text="c")]
          assert bad_citations("See 【3】.", [], ctx) == ()

      def test_past_the_end_is_still_out_of_range():
          ctx = [Retrieved(text="a"), Retrieved(text="b"), Retrieved(text="c")]
          assert bad_citations("See 【4】.", [], ctx) == ("citation-out-of-range:4",)
  reference:
    - file: src/guardrail_eval_pipeline/guardrails/deterministic.py
      old: "if index < 1 or index >= len(contexts):"
      new: "if index < 1 or index > len(contexts):"

- key: memory-twin
  type: bug_fix
  expect: pr
  labels: [ai-assignable]
  hold_back: true            # file only after citation-off-by-one is merged (Task 27 Step 3b); never cut
  title: "The same identifier is reported twice when the answer repeats it"
  body: |
    When an answer mentions an identifier that is in none of the passages twice ("CLM-1 … CLM-1"), the output guardrail
    lists `claim:CLM-1` twice in its reasons, and the order changes between runs. Each identifier should appear once,
    in a stable (sorted) order.
  hidden:
    path: tests/test_hidden_identifiers_once.py
    content: |
      from guardrail_eval_pipeline.contracts import Retrieved
      from guardrail_eval_pipeline.guardrails.deterministic import uncontained_identifiers

      def test_each_identifier_once_and_sorted():
          found = uncontained_identifiers("CLM-2 then CLM-1 and CLM-2 again", [Retrieved(text="nothing")], {"claim": r"CLM-\d"})
          assert found == ("claim:CLM-1", "claim:CLM-2")
  reference:
    - file: src/guardrail_eval_pipeline/guardrails/deterministic.py
      old: "    return tuple(found)"
      new: "    return tuple(sorted(set(found)))"

- key: check-passed
  type: feature_addition
  expect: pr
  labels: [ai-assignable]
  title: "Add a `passed` property to heuristics.Check"
  body: |
    `Check` has `failed`, so callers write `not check.failed`, which wrongly treats `n/a` as a pass.
    Add a `passed` property that is True only when the status is `pass` (False for `fail` and `n/a`).
  hidden:
    path: tests/test_hidden_check_passed.py
    content: |
      from guardrail_eval_pipeline.heuristics import FAIL, NOT_APPLICABLE, PASS, Check

      def test_passed_only_for_pass():
          assert Check("x", PASS).passed is True
          assert Check("x", FAIL).passed is False
          assert Check("x", NOT_APPLICABLE).passed is False
  reference:
    - file: src/guardrail_eval_pipeline/heuristics.py
      old: |2
            @property
            def failed(self) -> bool:
                return self.status == FAIL
      new: |2
            @property
            def failed(self) -> bool:
                return self.status == FAIL

            @property
            def passed(self) -> bool:
                return self.status == PASS

